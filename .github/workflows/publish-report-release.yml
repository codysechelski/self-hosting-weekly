name: Publish report release

on:
  push:
    branches:
      - main
    paths:
      - 'reports/20*.md'
  workflow_dispatch:
    inputs:
      report_file:
        description: 'Existing report markdown file in reports/ (for example: reports/2026-11-06.md)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine report files
        id: reports
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            files="${{ github.event.inputs.report_file }}"
            if [[ ! -f "$files" ]]; then
              echo "Could not find report file: $files" >&2
              exit 1
            fi
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [[ "$BEFORE" =~ ^0+$ ]]; then
              files="$(git ls-files 'reports/20??-??-??.md')"
            else
              files="$(git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" | grep -E '^reports/20[0-9]{2}-[0-9]{2}-[0-9]{2}\.md$' || true)"
            fi
          fi

          files="$(printf '%s\n' "$files" | sed '/^$/d')"

          if [[ -z "$files" ]]; then
            echo "No new dated report files found."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count="$(printf '%s\n' "$files" | wc -l | tr -d ' ')"

          {
            echo 'files<<EOF'
            printf '%s\n' "$files"
            echo 'EOF'
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub releases
        if: steps.reports.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            report_date="$(basename "${file%.md}")"
            tag="report-${report_date}"
            title="Self-Hosting Weekly — ${report_date}"
            url="https://github.com/${{ github.repository }}/blob/main/reports/${report_date}.md"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release already exists for $tag. Skipping."
              continue
            fi

          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          A new Self-Hosting Weekly report has been published.

          Read the report:
          ${url}

          Source file:
          - \`${file}\`
          EOF

          gh release create "$tag" \
            --title "$title" \
            --notes-file "$notes_file"
          done <<< "${{ steps.reports.outputs.files }}"
